<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Music Archive seedlist</title>
  <script src="../nav.js" defer></script>
  <style>
    /* same palette as the seedlist builder */
    :root {
      --bg: #f4f4f1; --panel: #fff; --ink: #1d2230; --muted: #626a78; --line: #dcdcd6;
      --blue: #3556a0; --hover: #ececE6; --playing: #e3eafb;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12151c; --panel: #1a1e27; --ink: #e6e8ee; --muted: #9aa1ae; --line: #2c3240; --blue: #7d9be0; --hover: #252b38; --playing: #24304a; color-scheme: dark; }
    }
    html { background: var(--bg); }
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: var(--ink); background: var(--bg); }
    h1 { font-size: 1.4rem; margin-bottom: .25rem; }
    .sub { color: var(--muted); margin-top: 0; }
    a { color: var(--blue); }
    audio { width: 100%; margin: 1rem 0; }
    .controls { display: flex; gap: .5rem; }
    button { font: inherit; padding: .4rem .9rem; cursor: pointer; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    button:hover { border-color: var(--muted); }
    ol { padding-left: 1.5rem; }
    li { padding: .5rem; border-radius: 6px; cursor: pointer; }
    li:hover { background: var(--hover); }
    li.playing { background: var(--playing); font-weight: 600; }
    .meta { display: block; font-weight: normal; color: var(--muted); font-size: .9rem; }
    .meta a { color: inherit; }
  </style>
</head>
<body>
  <h1>Live Music Archive seedlist</h1>
  <p class="sub">Five live recordings from the <a href="https://archive.org/details/etree">Internet Archive's Live Music Archive</a>.</p>

  <div id="now">Pick a song or press Play.</div>
  <audio id="audio" controls preload="none"></audio>
  <div class="controls">
    <button id="prev">⏮ Prev</button>
    <button id="play">▶ Play</button>
    <button id="next">Next ⏭</button>
  </div>

  <ol id="list"></ol>

  <script>
    const audio = document.getElementById('audio');
    const list = document.getElementById('list');
    const now = document.getElementById('now');
    const playBtn = document.getElementById('play');
    let tracks = [];
    let current = -1;

    function load(i) {
      current = (i + tracks.length) % tracks.length;
      const t = tracks[current];
      audio.src = `https://archive.org/download/${t.identifier}/${encodeURIComponent(t.file)}`;
      now.textContent = `Now playing: ${t.title} by ${t.artist} (${t.date})`;
      [...list.children].forEach((li, j) => li.classList.toggle('playing', j === current));
      audio.play();
    }

    playBtn.onclick = () => {
      if (current < 0) load(0);
      else if (audio.paused) audio.play();
      else audio.pause();
    };
    document.getElementById('prev').onclick = () => load(current - 1);
    document.getElementById('next').onclick = () => load(current + 1);
    audio.onplay = () => playBtn.textContent = '⏸ Pause';
    audio.onpause = () => playBtn.textContent = '▶ Play';
    audio.onended = () => load(current + 1);

    // ?seedlist=local plays the list made in the seedlist builder (kept in this browser)
    const local = new URLSearchParams(location.search).get('seedlist') === 'local'
      && JSON.parse(localStorage.getItem('linkydink.seedlist') || 'null');
    (local ? Promise.resolve(local) : fetch('seedlist.json').then(r => r.json()))
      .then(data => {
        if (local) {
          document.querySelector('h1').textContent = data.name;
          document.querySelector('.sub').innerHTML = 'Made in the <a href="../seedlist-builder/">seedlist builder</a>.';
        }
        tracks = data.tracks;
        tracks.forEach((t, i) => {
          const li = document.createElement('li');
          li.innerHTML = `${t.title} by ${t.artist}
            <span class="meta">${t.venue}, ${t.date} ·
            <a href="https://archive.org/details/${t.identifier}" target="_blank">archive.org</a></span>`;
          li.onclick = e => { if (e.target.tagName !== 'A') load(i); };
          list.appendChild(li);
        });
      });
  </script>
</body>
</html>
